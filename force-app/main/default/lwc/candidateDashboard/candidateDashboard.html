<template>
    <!-- Loading -->
    <template if:true={isLoading}>
        <div class="loading-container">
            <div class="spinner"></div>
            <p>Chargement de votre espace...</p>
        </div>
    </template>

    <!-- Guest / Non connecte -->
    <template if:true={isGuest}>
        <div class="guest-preview">
            <!-- Hero -->
            <div class="guest-hero">
                <div class="guest-hero-badge">Portail RH Talan</div>
                <h1 class="guest-hero-title">Votre Espace Candidat</h1>
                <p class="guest-hero-sub">Suivez vos candidatures, consultez vos scores IA et gerez votre profil en un seul endroit.</p>
                <button class="guest-login-btn" onclick={goToLogin}>
                    <span>Se connecter</span>
                    <span class="btn-arrow">-></span>
                </button>
                <p class="guest-hero-hint">Vous n'avez pas encore de compte ? Postulez a une offre pour en creer un automatiquement.</p>
            </div>

            <!-- Feature cards -->
            <div class="guest-features">
                <div class="guest-feat-card">
                    <div class="feat-icon">DB</div>
                    <h3>Tableau de bord</h3>
                    <p>Visualisez l'etat de toutes vos candidatures en temps reel avec des indicateurs clairs.</p>
                </div>
                <div class="guest-feat-card">
                    <div class="feat-icon">AI</div>
                    <h3>Score IA</h3>
                    <p>Consultez votre score de matching genere par notre IA pour chaque poste.</p>
                </div>
                <div class="guest-feat-card">
                    <div class="feat-icon">CV</div>
                    <h3>Gestion CV</h3>
                    <p>Retrouvez votre CV depose et suivez son analyse automatique.</p>
                </div>
                <div class="guest-feat-card">
                    <div class="feat-icon">PR</div>
                    <h3>Mon Profil</h3>
                    <p>Mettez a jour vos informations personnelles et suivez votre parcours candidat.</p>
                </div>
            </div>

            <!-- Preview dashboard (blurred) -->
            <div class="guest-blur-section">
                <div class="blur-overlay">
                    <div class="blur-cta">
                        <span class="blur-lock"></span>
                        <p>Connectez-vous pour acceder a votre espace</p>
                        <button class="guest-login-btn-sm" onclick={goToLogin}>Se connecter</button>
                    </div>
                </div>
                <div class="blur-content">
                    <div class="fake-stats">
                        <div class="fake-stat-card"><div class="fake-icon">CA</div><div class="fake-val">--</div><div class="fake-lbl">Candidatures</div></div>
                        <div class="fake-stat-card"><div class="fake-icon">OK</div><div class="fake-val">--</div><div class="fake-lbl">En cours</div></div>
                        <div class="fake-stat-card"><div class="fake-icon">IA</div><div class="fake-val">--%</div><div class="fake-lbl">Meilleur score IA</div></div>
                        <div class="fake-stat-card"><div class="fake-icon">CV</div><div class="fake-val">--</div><div class="fake-lbl">CV depose</div></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Dashboard principal -->
    <template if:false={isGuest}>
        <template if:false={isLoading}>
            <div class="app-shell">

                <!-- NAVBAR -->
                <nav class="dash-navbar">
                    <div class="nav-logo" onclick={goToHome}>
                        <div class="nav-logo-mark">T</div>
                        <div class="nav-logo-info">
                            <span class="nav-brand-name">Talent Portal</span>
                            <span class="nav-brand-sub">by Talan Tunisie</span>
                        </div>
                    </div>
                    <div class="nav-links">
                        <button class={navHomeClass} onclick={goToHome}>Accueil</button>
                        <button class={navOffersClass} onclick={goToOffers}>Offres</button>
                        <button class={navSpaceClass} onclick={goToCandidateSpace}>Mon espace</button>
                    </div>
                    <button class={navSavedClass} onclick={goToSavedOffers}>
                        <span class="nav-saved-icon">SV</span>
                        <span>Saved ({savedJobsCount})</span>
                    </button>
                    <div class="nav-right">
                        <button class="btn-primary nav-cta" onclick={goToOffers}>+ Postuler</button>
                        <div class="profile-menu-wrapper">
                            <button class={profileBtnClass} onclick={toggleProfileMenu}>
                                <div class="avatar-ring">
                                    <div class="avatar-dynamic">{initials}</div>
                                    <span class="online-dot"></span>
                                </div>
                                <div class="avatar-info-mini">
                                    <span class="avatar-name-mini">{capitalizedFirstName}</span>
                                    <span class="avatar-role-mini">Candidat</span>
                                </div>
                                <svg class="avatar-chevron-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <template if:true={isProfileMenuOpen}>
                                <div class="profile-dropdown">
                                    <div class="pd-head">
                                        <div class="pd-avatar-lg">{initials}</div>
                                        <div class="pd-head-info">
                                            <span class="pd-head-name">{fullName}</span>
                                            <span class="pd-head-email">{profile.email}</span>
                                        </div>
                                    </div>
                                    <div class="pd-actions">
                                        <button class="pd-action-btn" onclick={goToProfileTab}>
                                            <span class="pd-action-icon">PR</span>
                                            <span>Mon profil</span>
                                        </button>
                                        <button class="pd-action-btn" onclick={goToOffers}>
                                            <span class="pd-action-icon">OF</span>
                                            <span>Voir les offres</span>
                                        </button>
                                    </div>
                                    <div class="pd-separator"></div>
                                    <button class="pd-logout-btn" onclick={handleLogout}>
                                        <span class="pd-action-icon">-></span>
                                        <span>Se deconnecter</span>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>
                </nav>

                <!-- CORPS -->
                <div class="app-body">

                    <!-- SIDEBAR -->
                    <aside class="sidebar">
                        <div class="sb-user">
                            <div class="sb-avatar">{initials}</div>
                            <div class="sb-user-info">
                                <span class="sb-name">{fullName}</span>
                                <span class="sb-role">Candidat</span>
                            </div>
                        </div>

                        <div class="sb-section">
                            <div class="sb-section-label">Mes candidatures</div>
                            <template if:true={hasCandidatures}>
                                <div class="sb-cand-list">
                                    <template for:each={candidatures} for:item="c">
                                        <button key={c.id} class="sb-cand-item" data-id={c.id} onclick={viewCandidatureFromSidebar}>
                                            <div class="sb-cand-name">{c.jobTitle}</div>
                                            <div class="sb-cand-meta">
                                                <span class="sb-cand-date">{c.closeDateFormatted}</span>
                                                <span class={c.badgeClass}>{c.stageLabel}</span>
                                            </div>
                                        </button>
                                    </template>
                                </div>
                            </template>
                            <template if:false={hasCandidatures}>
                                <p class="sb-empty">Aucune candidature pour le moment.</p>
                            </template>
                        </div>

                        <template if:true={showSidebarDetailNav}>
                            <div class="sb-detail-nav">
                                <div class="sb-section-label">Parcours</div>
                                <div class="sb-detail-list">
                                    <button class={sectionGamingClass} data-section="gaming" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="3" y="8" width="18" height="10" rx="3"></rect>
                                                <line x1="8" y1="11" x2="8" y2="15"></line>
                                                <line x1="6" y1="13" x2="10" y2="13"></line>
                                                <circle cx="15.5" cy="12.5" r="1"></circle>
                                                <circle cx="18" cy="14.5" r="1"></circle>
                                            </svg>
                                        </span>
                                        <span>Coding Game</span>
                                    </button>
                                    <button class={sectionTechnicalClass} data-section="technical" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                                                <line x1="8" y1="20" x2="16" y2="20"></line>
                                                <line x1="12" y1="16" x2="12" y2="20"></line>
                                                <polyline points="10 9 8 11 10 13"></polyline>
                                                <polyline points="14 9 16 11 14 13"></polyline>
                                            </svg>
                                        </span>
                                        <span>Technical Interview</span>
                                    </button>
                                    <button class={sectionArchitectureClass} data-section="architecture" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M12 4 4 8l8 4 8-4-8-4z"></path>
                                                <path d="m4 12 8 4 8-4"></path>
                                                <path d="m4 16 8 4 8-4"></path>
                                            </svg>
                                        </span>
                                        <span>Architecture Interview</span>
                                    </button>
                                    <button class={sectionRhfitClass} data-section="rhfit" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                                <circle cx="9" cy="7" r="3"></circle>
                                                <path d="M22 20v-2a4 4 0 0 0-3-3.87"></path>
                                                <path d="M16 3.13a3 3 0 0 1 0 5.74"></path>
                                            </svg>
                                        </span>
                                        <span>RH Fit Interview</span>
                                    </button>
                                    <button class={sectionHiredClass} data-section="hired" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="12" r="9"></circle>
                                                <polyline points="8 12 11 15 16 9"></polyline>
                                            </svg>
                                        </span>
                                        <span>Hired</span>
                                    </button>
                                    <button class={sectionContractClass} data-section="contract" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"></path>
                                                <polyline points="14 2 14 7 19 7"></polyline>
                                                <line x1="9" y1="12" x2="15" y2="12"></line>
                                                <line x1="9" y1="16" x2="15" y2="16"></line>
                                            </svg>
                                        </span>
                                        <span>Contract</span>
                                    </button>
                                </div>

                                <div class="sb-section-label sb-section-label-help">Aide</div>
                                <div class="sb-detail-list">
                                    <button class={sectionGuideClass} data-section="guide" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M13 2 3 14h7l-1 8 10-12h-7z"></path>
                                            </svg>
                                        </span>
                                        <span>Start guide</span>
                                    </button>
                                    <button class={sectionDocumentationClass} data-section="documentation" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                            </svg>
                                        </span>
                                        <span>Documentation</span>
                                    </button>
                                    <button class={sectionMeetingsClass} data-section="meetings" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="3" y="6" width="14" height="12" rx="2"></rect>
                                                <polygon points="17 10 22 7 22 17 17 14"></polygon>
                                            </svg>
                                        </span>
                                        <span>How meetings work</span>
                                    </button>
                                    <button class={sectionFaqClass} data-section="faq" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                                <circle cx="12" cy="12" r="9"></circle>
                                                <path d="M9.1 9a3 3 0 1 1 4.8 2.4c-.9.6-1.4 1.1-1.4 2.1"></path>
                                                <line x1="12" y1="17.5" x2="12.01" y2="17.5"></line>
                                            </svg>
                                        </span>
                                        <span>FAQ</span>
                                    </button>
                                    <button class={sectionSupportClass} data-section="support" onclick={handleDetailSectionSelect}>
                                        <span class="sb-ico" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
                                            </svg>
                                        </span>
                                        <span>Contact support</span>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <div class="sb-footer">
                            <button class="sb-logout-btn" onclick={handleLogout}>
                                <span>-></span>
                                <span>Se deconnecter</span>
                            </button>
                        </div>
                    </aside>

                    <!-- CONTENU PRINCIPAL -->
                    <main class="main-content">
                        <template if:false={isOffers}>
                            <div class="main-welcome">
                                <div class="welcome-copy">
                                    <span class="welcome-kicker">Candidate dashboard</span>
                                    <h1 class="welcome-title">Bonjour, {capitalizedFirstName}</h1>
                                    <p class="welcome-sub">Suivez vos candidatures, vos scores et votre progression depuis une seule interface.</p>
                                </div>
                                <div class="welcome-highlight">
                                    <span class="welcome-highlight-value">{totalCandidatures}</span>
                                    <span class="welcome-highlight-label">Candidatures</span>
                                </div>
                            </div>

                            <!-- PROGRESSION GLOBALE -->
                            <template if:true={hasCandidatures}>
                                <div class="global-pipeline">
                                    <span class="gp-label">PROGRESSION</span>
                                    <div class="pipeline-track">
                                        <div class={globalStep1Class}><div class="step-dot">1</div><span>Gaming</span></div>
                                        <div class="pipeline-line-h"></div>
                                        <div class={globalStep2Class}><div class="step-dot">2</div><span>Technique</span></div>
                                        <div class="pipeline-line-h"></div>
                                        <div class={globalStep3Class}><div class="step-dot">3</div><span>Architecture</span></div>
                                        <div class="pipeline-line-h"></div>
                                        <div class={globalStep4Class}><div class="step-dot">4</div><span>RH Fit</span></div>
                                        <div class="pipeline-line-h"></div>
                                        <div class={globalStep5Class}><div class="step-dot">5</div><span>Hired</span></div>
                                        <div class="pipeline-line-h"></div>
                                        <div class={globalStep6Class}><div class="step-dot">6</div><span>Contrat</span></div>
                                    </div>
                                </div>
                            </template>

                            <!-- STATS -->
                            <div class="stats-row">
                                <div class="stat-card stat-card-blue">
                                    <div class="stat-icon-wrap stat-bg-blue">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                    </div>
                                    <div class="stat-value">{totalCandidatures}</div>
                                    <div class="stat-label">Candidatures</div>
                                </div>
                                <div class="stat-card stat-card-green">
                                    <div class="stat-icon-wrap stat-bg-green">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    </div>
                                    <div class="stat-value">{activeCount}</div>
                                    <div class="stat-label">En cours</div>
                                </div>
                                <div class="stat-card stat-card-purple">
                                    <div class="stat-icon-wrap stat-bg-purple">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                    </div>
                                    <div class="stat-value">
                                        <template if:true={bestScore}>{bestScore}%</template>
                                        <template if:false={bestScore}>-</template>
                                    </div>
                                    <div class="stat-label">Meilleur score IA</div>
                                </div>
                                <div class="stat-card stat-card-orange">
                                    <div class="stat-icon-wrap stat-bg-orange">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                    </div>
                                    <div class="stat-value">
                                        <template if:true={cv}>1</template>
                                        <template if:false={cv}>0</template>
                                    </div>
                                    <div class="stat-label">CV depose</div>
                                </div>
                            </div>
                        </template>

                        <!-- TAB: VUE D'ENSEMBLE -->
                        <template if:true={isOverview}>
                            <div class="tab-content">
                                <div class="overview-grid">
                                    <div class="panel">
                                        <div class="panel-header">
                                            <h3>Dernieres candidatures</h3>
                                        </div>
                                        <template if:true={hasCandidatures}>
                                            <div class="candidature-list">
                                                <template for:each={candidatures} for:item="c">
                                                    <div key={c.id} class="cand-row" data-id={c.id} onclick={viewCandidature}>
                                                        <div class="cand-info">
                                                            <div class="cand-name-row">
                                                                <template if:true={c.gamingScheduled}><span class="gaming-glow-dot"></span></template>
                                                                <span class="cand-name">{c.jobTitle}</span>
                                                            </div>
                                                            <div class="cand-chips">
                                                                <template if:true={c.department}><span class="chip chip-dept">Dept {c.department}</span></template>
                                                                <template if:true={c.location}><span class="chip chip-loc">Lieu {c.location}</span></template>
                                                                <template if:true={c.contractType}><span class="chip chip-ct">Type {c.contractType}</span></template>
                                                                <span class="chip chip-date">Date {c.formattedDate}</span>
                                                                <span class="chip chip-close">Cloture {c.closeDateFormatted}</span>
                                                            </div>
                                                        </div>
                                                        <div class="cand-right">
                                                            <template if:true={c.gamingScheduled}>
                                                                <span class="gaming-glow-badge">
                                                                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="8" cy="12" r="1" fill="currentColor"/><line x1="6" y1="10" x2="10" y2="10"/><line x1="8" y1="8" x2="8" y2="12"/></svg>
                                                                    Test planifie
                                                                </span>
                                                            </template>
                                                            <template if:true={c.hasScore}>
                                                                <span class={c.scoreClass}>{c.score}%</span>
                                                            </template>
                                                            <span class={c.badgeClass}>{c.stageLabel}</span>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:false={hasCandidatures}>
                                            <div class="empty-panel">
                                                <p>Aucune candidature pour le moment.</p>
                                                <button class="btn-secondary" onclick={goToOffers}>Explorer les offres</button>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="side-panels">
                                        <div class="panel panel-sm">
                                            <div class="panel-header">
                                                <h3>Mon CV</h3>
                                                <label class="btn-mini-upload">
                                                    <template if:true={cv}>Remplacer</template>
                                                    <template if:false={cv}>Uploader</template>
                                                    <input type="file" accept=".pdf,.doc,.docx" onchange={handleCvFileChange} class="cv-hidden-input" />
                                                </label>
                                            </div>
                                            <template if:true={isUploadingCv}>
                                                <div class="cv-upload-progress">
                                                    <div class="cv-progress-bar"></div>
                                                    <span>Upload en cours...</span>
                                                </div>
                                            </template>
                                            <template if:true={cv}>
                                                <div class="cv-info">
                                                    <div class="cv-icon">CV</div>
                                                    <div class="cv-details">
                                                        <span class="cv-name">{cv.title}.{cv.extension}</span>
                                                        <span class="cv-meta">{cvSizeFormatted} - Depose le {cvDateFormatted}</span>
                                                    </div>
                                                    <button class="btn-view-cv-sm" onclick={viewCv} title="Voir le CV">Voir</button>
                                                </div>
                                            </template>
                                            <template if:false={cv}>
                                                <div class="empty-panel">
                                                    <p>Aucun CV depose.</p>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="panel panel-sm">
                                            <div class="panel-header">
                                                <h3>Profil</h3>
                                            </div>
                                            <div class="profile-quick">
                                                <div class="pq-row">
                                                    <span class="pq-label">Email</span>
                                                    <span class="pq-value">{profile.email}</span>
                                                </div>
                                                <template if:true={profile.phone}>
                                                    <div class="pq-row">
                                                        <span class="pq-label">Tel</span>
                                                        <span class="pq-value">{profile.phone}</span>
                                                    </div>
                                                </template>
                                                <div class="pq-row">
                                                    <span class="pq-label">Depuis</span>
                                                    <span class="pq-value">Depuis {memberSinceFormatted}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- TAB: OFFRES -->
                        <template if:true={isOffers}>
                            <div class="tab-content offers-tab-content">
                                <div class="offers-embedded-shell">
                                    <template if:true={showSavedOffersList}>
                                        <c-job-list embedded="true" display-mode="saved" onsavedchange={handleSavedJobsChange}></c-job-list>
                                    </template>
                                    <template if:false={showSavedOffersList}>
                                        <c-job-list embedded="true" display-mode="all" onsavedchange={handleSavedJobsChange}></c-job-list>
                                    </template>
                                </div>
                            </div>
                        </template>

                                                        <template if:true={selectedCandidature.techCompleted}>
                                                            <div class="tl-result">
                                                                <span class={selectedCandidature.techScoreClass}>{selectedCandidature.techScore}/100</span>
                                                                <template if:true={selectedCandidature.hasManagerScore}>
                                                                    <span class="tl-validated">Valide: {selectedCandidature.managerValidatedScore}/100</span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <template if:false={selectedCandidature.techCompleted}>
                                                            <template if:true={selectedCandidature.techDateFmt}>
                                                                <span class="tl-scheduled">{selectedCandidature.techDateFmt}</span>
                                                            </template>
                                                            <template if:false={selectedCandidature.techDateFmt}>
                                                                <span class="tl-pending">-</span>
                                                            </template>
                                                        </template>
                                                    </div>
                                                </div>
                                                <!-- Etape 4: Architecture -->
                                                <div class={selectedCandidature.stepResultClass4}>
                                                    <div class="tl-dot-wrap"><div class="tl-dot">4</div></div>
                                                    <div class="tl-content">
                                                        <span class="tl-step-name">Entretien Architecture</span>
                                                        <template if:true={selectedCandidature.archCompleted}>
                                                            <div class="tl-result">
                                                                <span class={selectedCandidature.archScoreClass}>{selectedCandidature.archScore}/100</span>
                                                            </div>
                                                        </template>
                                                        <template if:false={selectedCandidature.archCompleted}>
                                                            <template if:true={selectedCandidature.archDateFmt}>
                                                                <span class="tl-scheduled">{selectedCandidature.archDateFmt}</span>
                                                            </template>
                                                            <template if:false={selectedCandidature.archDateFmt}>
                                                                <span class="tl-pending">-</span>
                                                            </template>
                                                        </template>
                                                    </div>
                                                </div>
                                                <!-- Etape 5: RH Fit -->
                                                <div class={selectedCandidature.stepResultClass5}>
                                                    <div class="tl-dot-wrap"><div class="tl-dot">5</div></div>
                                                    <div class="tl-content">
                                                        <span class="tl-step-name">Entretien RH Fit</span>
                                                        <template if:true={selectedCandidature.rhfitCompleted}>
                                                            <div class="tl-result">
                                                                <span class={selectedCandidature.rhfitScoreClass}>{selectedCandidature.rhfitScore}/100</span>
                                                            </div>
                                                        </template>
                                                        <template if:false={selectedCandidature.rhfitCompleted}>
                                                            <template if:true={selectedCandidature.rhfitDateFmt}>
                                                                <span class="tl-scheduled">{selectedCandidature.rhfitDateFmt}</span>
                                                            </template>
                                                            <template if:false={selectedCandidature.rhfitDateFmt}>
                                                                <span class="tl-pending">-</span>
                                                            </template>
                                                        </template>
                                                    </div>
                                                </div>
                                                <!-- Etape 6: Hired + Contrat -->
                                                <div class={selectedCandidature.stepResultClass6}>
                                                    <div class="tl-dot-wrap"><div class="tl-dot">6</div></div>
                                                    <div class="tl-content">
                                                        <span class="tl-step-name">Embauche &amp; Contrat</span>
                                                        <template if:true={selectedCandidature.isHired}>
                                                            <div class="tl-result">
                                                                <span class={selectedCandidature.contractStatusClass}>{selectedCandidature.contractStatusLabel}</span>
                                                            </div>
                                                        </template>
                                                        <template if:false={selectedCandidature.isHired}>
                                                            <span class="tl-pending">-</span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template if:false={selectedCandidature}>

                                    <!-- FILTERS BAR -->
                                    <div class="filters-bar">
                                        <div class="filter-search-wrap">
                                            <svg class="filter-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                            <input type="text" class="filter-search" placeholder="Rechercher par poste..." value={filterSearch} onchange={handleFilterSearch} />
                                        </div>
                                        <div class="filter-group">
                                            <select class="filter-select" onchange={handleFilterStage}>
                                                <option value="">Toutes les etapes</option>
                                                <option value="Gaming">Screening IA</option>
                                                <option value="Technique">Entretien Technique</option>
                                                <option value="Architecture">Entretien Architecture</option>
                                                <option value="RH Fit">Entretien RH</option>
                                                <option value="ClosedWon">Embauche</option>
                                                <option value="ClosedLost">Non retenu</option>
                                                <option value="Closed">Finalisee</option>
                                            </select>
                                            <select class="filter-select" onchange={handleFilterScore}>
                                                <option value="">Tous les scores</option>
                                                <option value="high">>= 60% - Bon/Excellent</option>
                                                <option value="medium">40-59% - Moyen</option>
                                                <option value="low">&lt; 40% - Insuffisant</option>
                                            </select>
                                            <select class="filter-select" onchange={handleFilterSort}>
                                                <option value="recent">Plus recentes</option>
                                                <option value="oldest">Plus anciennes</option>
                                                <option value="score-desc">Score desc</option>
                                                <option value="score-asc">Score asc</option>
                                                <option value="alpha">A -> Z</option>
                                            </select>
                                        </div>
                                        <template if:true={hasActiveFilters}>
                                            <button class="filter-clear-btn" onclick={clearFilters}>
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                                Reinitialiser
                                            </button>
                                        </template>
                                    </div>

                                    <!-- Results count -->
                                    <div class="filter-results-count">
                                        <span>{filteredCount} candidature(s) affichee(s)</span>
                                    </div>

                                    <template if:true={hasFilteredCandidatures}>
                                        <div class="cand-cards">
                                            <template for:each={filteredCandidatures} for:item="c">
                                                <div key={c.id} class="cand-card" data-id={c.id} onclick={viewCandidature}>
                                                    <div class="cc-top">
                                                        <div class="cc-top-left">
                                                            <h3>{c.name}</h3>
                                                            <template if:true={c.gamingScheduled}>
                                                                <span class="gaming-glow-badge gaming-glow-sm">
                                                                    <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="8" cy="12" r="1" fill="currentColor"/><line x1="6" y1="10" x2="10" y2="10"/><line x1="8" y1="8" x2="8" y2="12"/></svg>
                                                                    Test planifie
                                                                </span>
                                                            </template>
                                                        </div>
                                                        <span class={c.badgeClass}>{c.stageLabel}</span>
                                                    </div>
                                                    <div class="cc-meta">
                                                        <template if:true={c.department}><span>Dept {c.department}</span></template>
                                                        <template if:true={c.location}><span>Lieu {c.location}</span></template>
                                                        <template if:true={c.contractType}><span>Type {c.contractType}</span></template>
                                                        <span>Date {c.formattedDate}</span>
                                                        <span>Cloture: {c.closeDateFormatted}</span>
                                                    </div>
                                                    <template if:true={c.hasScore}>
                                                        <div class="cc-score">
                                                            <div class="score-bar-bg"><div class={c.scoreBarClass}></div></div>
                                                            <span class={c.scoreClass}>{c.score}%</span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={hasFilteredCandidatures}>
                                        <template if:true={hasCandidatures}>
                                            <div class="empty-state">
                                                <div class="empty-icon">N/A</div>
                                                <h3>Aucun resultat</h3>
                                                <p>Aucune candidature ne correspond a vos filtres.</p>
                                                <button class="btn-secondary" onclick={clearFilters}>Reinitialiser les filtres</button>
                                            </div>
                                        </template>
                                        <template if:false={hasCandidatures}>
                                            <div class="empty-state">
                                                <div class="empty-icon">CV</div>
                                                <h3>Aucune candidature</h3>
                                                <p>Explorez les offres disponibles et postulez !</p>
                                                <button class="btn-primary" onclick={goToOffers}>Voir les offres</button>
                                            </div>
                                        </template>
                                    </template>
                                </template>
                            </div>
                        </template>

                        <!-- TAB: PROFIL -->
                        <!-- TAB: PROFIL -->
                        <template if:true={isProfile}>
                            <div class="tab-content">
                                <div class="profile-panel">
                                    <div class="profile-card">
                                        <div class="pc-header">
                                            <div class="avatar avatar-lg">{initials}</div>
                                            <div class="pc-head-copy">
                                                <div class="profile-status-row">
                                                    <span class="profile-status-pill">Profil candidat</span>
                                                    <span class="profile-status-pill profile-status-pill-soft">{profileCompletionLabel}</span>
                                                </div>
                                                <h2>{fullName}</h2>
                                                <p class="pc-sub">Candidat | Membre depuis {memberSinceFormatted}</p>
                                            </div>
                                            <template if:false={isEditingProfile}>
                                                <button class="btn-edit" onclick={startEditProfile}>Modifier</button>
                                            </template>
                                        </div>
                                        <template if:false={isEditingProfile}>
                                            <div class="profile-summary-grid">
                                                <div class="profile-summary-card">
                                                    <span class="psc-label">Adresse email</span>
                                                    <span class="psc-value">{profile.email}</span>
                                                </div>
                                                <div class="profile-summary-card">
                                                    <span class="psc-label">Telephone</span>
                                                    <span class="psc-value">{profilePhoneDisplay}</span>
                                                </div>
                                                <div class="profile-summary-card">
                                                    <span class="psc-label">Adresse</span>
                                                    <span class="psc-value">{profileAddressDisplay}</span>
                                                </div>
                                            </div>
                                            <div class="profile-details">
                                                <div class="pd-row"><span class="pd-icon">EM</span><div><span class="pd-label">Adresse email</span><span class="pd-value">{profile.email}</span></div></div>
                                                <div class="pd-row"><span class="pd-icon">TL</span><div><span class="pd-label">Telephone</span><span class="pd-value">{profilePhoneDisplay}</span></div></div>
                                                <div class="pd-row"><span class="pd-icon">AD</span><div><span class="pd-label">Adresse</span><span class="pd-value">{profileAddressDisplay}</span></div></div>
                                            </div>
                                        </template>
                                        <template if:true={isEditingProfile}>
                                            <div class="edit-form">
                                                <div class="edit-form-head">
                                                    <h3>Mettre a jour mes informations</h3>
                                                    <p>Verifiez vos coordonnees pour faciliter le suivi de votre candidature.</p>
                                                </div>
                                                <div class="form-row"><label>Telephone</label><input type="tel" value={editPhone} onchange={handleEditPhone} placeholder="+216 00 000 000" /></div>
                                                <div class="form-row"><label>Adresse</label><input type="text" value={editAddress} onchange={handleEditAddress} placeholder="Rue, immeuble, quartier" /></div>
                                                <div class="form-row-2">
                                                    <div class="form-row"><label>Ville</label><input type="text" value={editCity} onchange={handleEditCity} placeholder="Tunis" /></div>
                                                    <div class="form-row"><label>Code postal</label><input type="text" value={editPostalCode} onchange={handleEditPostalCode} placeholder="1053" /></div>
                                                </div>
                                                <div class="form-actions">
                                                    <button class="btn-secondary" onclick={cancelEditProfile}>Annuler</button>
                                                    <button class="btn-primary" onclick={saveProfile} disabled={isSaving}>{saveButtonLabel}</button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="profile-card cv-upload-card">
                                        <div class="cv-card-header">
                                            <div class="cv-head-copy">
                                                <h3 class="pc-title">Mon CV</h3>
                                                <p class="cv-head-sub">Conservez un CV a jour pour accelerer l evaluation de votre profil.</p>
                                            </div>
                                            <label class="btn-upload-cv">
                                                <span class="upload-btn-icon">UP</span>
                                                <template if:true={cv}>Remplacer le document</template>
                                                <template if:false={cv}>Ajouter un document</template>
                                                <input type="file" accept=".pdf,.doc,.docx" onchange={handleCvFileChange} class="cv-hidden-input" />
                                            </label>
                                        </div>
                                        <template if:true={isUploadingCv}>
                                            <div class="cv-uploading-banner"><div class="cv-spinner-sm"></div><span>Televersement en cours...</span></div>
                                        </template>
                                        <template if:true={cvUploadSuccess}>
                                            <div class="cv-success-banner"><span>Votre CV a ete mis a jour avec succes.</span></div>
                                        </template>
                                        <template if:true={cvUploadError}>
                                            <div class="cv-error-banner">{cvUploadError}</div>
                                        </template>
                                        <template if:true={cv}>
                                            <div class="cv-file-display">
                                                <div class="cv-file-thumb"><span class="cv-ext-badge">{cv.extension}</span></div>
                                                <div class="cv-file-info">
                                                    <span class="cv-file-name">{cv.title}.{cv.extension}</span>
                                                    <span class="cv-file-meta">{cvSizeFormatted} | Depose le {cvDateFormatted}</span>
                                                </div>
                                                <div class="cv-file-actions">
                                                    <button class="btn-view-cv" onclick={viewCv}><span>VR</span> Voir</button>
                                                    <button class="btn-dl-cv" onclick={downloadCv}><span>DL</span> Telecharger</button>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={cv}>
                                            <div class="cv-empty-zone">
                                                <div class="cv-empty-icon">CV</div>
                                                <p class="cv-empty-title">Aucun document disponible</p>
                                                <p class="cv-empty-hint">Formats acceptes : PDF, Word (.doc, .docx) | Taille maximale : 5 MB</p>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:false={isOffers}>
                        <!-- CARTE MONDIALE - section fixe en bas -->
                        <div class="map-bottom-section">
                            <div class="map-bottom-header">
                                <div class="map-title-row">
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                    <h3>Opportunites dans le monde</h3>
                                </div>
                                <p class="map-subtitle">Decouvrez les postes Talan a travers le globe</p>
                            </div>
                            <div class="map-bottom-wrap">
                                <iframe
                                    class="map-iframe"
                                    src={mapUrl}
                                    frameborder="0"
                                    title="Carte mondiale des offres Talan"
                                    onload={handleMapLoad}>
                                </iframe>
                            </div>
                        </div>
                        </template>

                        <!-- Error -->
                        <template if:true={errorMessage}>
                            <div class="error-bar">{errorMessage}</div>
                        </template>
                    </main>
                </div>
            </div>
        </template>
    </template>

    <!-- AGENTFORCE CHATBOT - bulle flottante bas droite -->
    <template if:false={isGuest}>
    </template>

    <!-- RESCHEDULE MODAL -->
    <template if:true={showRescheduleModal}>
        <div class="reschedule-overlay" onclick={closeRescheduleModal}>
            <div class="reschedule-modal-card" onclick={stopReschedulePropagation}>
                <div class="reschedule-modal-header">
                    <h3>Demander un report d entretien</h3>
                    <button class="reschedule-modal-close" onclick={closeRescheduleModal}>X</button>
                </div>
                <div class="reschedule-modal-body">
                    <template if:true={rescheduleSuccess}>
                        <div class="reschedule-success-msg">
                            <span class="reschedule-success-icon">OK</span>
                            <div>
                                <strong>Demande envoyee !</strong>
                                <p>Le recruteur a ete notifie. Vous serez recontacte(e) pour une nouvelle date.</p>
                            </div>
                        </div>
                    </template>
                    <template if:false={rescheduleSuccess}>
                        <p class="reschedule-modal-info">
                            Cette action est <strong>irreversible</strong> et ne peut etre effectuee qu une seule fois.
                            Le recruteur recevra votre demande par email.
                        </p>
                        <label class="reschedule-modal-label" for="reschedReason">Raison du report (optionnel)</label>
                        <textarea id="reschedReason" class="reschedule-modal-textarea" placeholder="Ex: Conflit d'horaire, urgence personnelle..." value={rescheduleReason} onchange={handleRescheduleReason}></textarea>
                    </template>
                </div>
                <template if:false={rescheduleSuccess}>
                    <div class="reschedule-modal-footer">
                        <button class="btn-cancel-resched" onclick={closeRescheduleModal}>Annuler</button>
                        <button class="btn-confirm-resched" onclick={confirmReschedule}>
                            <template if:true={isRescheduling}>Envoi en cours...</template>
                            <template if:false={isRescheduling}>Confirmer le report</template>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </template>

</template>
